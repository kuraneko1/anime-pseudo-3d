<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ANIME PSEUDO-3D PLAYER</title>
  <style>
/* Anime Pseudo-3D Reusable 100% Pixel-Art Studio UI Theme
 * Zero non-zero border-radius, zero backdrop-filter blur, zero native range/select styling.
 */
:root {
  --bg-deep: #0b1126;
  --panel-bg: #141c3a;
  --panel-hi: #2d3e76;
  --panel-lo: #080c1c;
  --border-ink: #050814;
  --accent-cyan: #58c4ff;
  --accent-blue: #4d6bfe;
  --accent-gold: #facc15;
  --text-main: #eef4ff;
  --text-dim: #9ab0db;
}

* {
  box-sizing: border-box;
  border-radius: 0;
  user-select: none;
  -webkit-user-select: none;
}

html, body, #appRoot {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg-deep);
  color: var(--text-main);
  font-family: "Courier New", "Noto Sans Mono CJK JP", monospace;
}

::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
::-webkit-scrollbar-track {
  background: #090e20;
  border: 2px solid var(--border-ink);
}
::-webkit-scrollbar-thumb {
  background: #3a5296;
  border: 2px solid var(--border-ink);
  box-shadow: inset 2px 2px 0 #6b88d8, inset -2px -2px 0 #1e2d5c;
}

button {
  appearance: none;
  -webkit-appearance: none;
  font-family: inherit;
  cursor: pointer;
  border-radius: 0;
}

:focus-visible {
  outline: 2px solid var(--accent-gold);
  outline-offset: 2px;
}

.app-shell {
  display: grid;
  grid-template-columns: 1fr 376px;
  width: 100%;
  height: 100%;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

.stage-wrap {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #dfe9f8;
}

#stageCanvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: grab;
}
#stageCanvas.dragging {
  cursor: grabbing;
}

.drop-overlay {
  position: absolute;
  inset: 12px;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: rgba(11, 17, 38, 0.88);
  border: 4px dashed var(--accent-cyan);
  color: #ffffff;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 1px;
  pointer-events: none;
  z-index: 20;
}
.drop-overlay.active {
  display: flex;
}
.drop-overlay-sub {
  font-size: 11px;
  color: var(--accent-gold);
}

.empty-stage-banner {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  padding: 16px 22px;
  background: rgba(14, 22, 48, 0.96);
  border: 3px solid var(--border-ink);
  box-shadow: inset 2px 2px 0 #3a549c, inset -2px -2px 0 #070b18, 0 5px 0 rgba(0, 0, 0, 0.55);
  text-align: center;
  z-index: 15;
}
.empty-stage-banner h2 {
  margin: 0 0 6px 0;
  font-size: 14px;
  color: var(--accent-cyan);
  letter-spacing: 1px;
}
.empty-stage-banner p {
  margin: 0 0 12px 0;
  font-size: 11px;
  color: var(--text-dim);
}

.stage-badge {
  position: absolute;
  top: 12px;
  left: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 11px;
  background: var(--panel-bg);
  border: 2px solid var(--border-ink);
  box-shadow: inset 2px 2px 0 var(--panel-hi), inset -2px -2px 0 var(--panel-lo), 0 4px 0 rgba(0, 0, 0, 0.55);
  pointer-events: none;
}
.stage-badge-title {
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 1px;
  color: #ffffff;
}
.stage-badge-sub {
  font-size: 10px;
  font-weight: 700;
  color: var(--accent-cyan);
  margin-top: 2px;
}

.hud-chip {
  position: absolute;
  top: 12px;
  right: 12px;
  padding: 6px 10px;
  background: rgba(14, 22, 48, 0.94);
  border: 2px solid var(--border-ink);
  box-shadow: inset 2px 2px 0 #293c74, inset -2px -2px 0 #070b18, 0 3px 0 rgba(0, 0, 0, 0.5);
  font-size: 12px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  color: var(--accent-gold);
  pointer-events: none;
  letter-spacing: 0.6px;
}

.status-toast {
  position: absolute;
  left: 50%;
  bottom: 54px;
  transform: translateX(-50%);
  padding: 6px 12px;
  background: rgba(14, 22, 48, 0.96);
  border: 2px solid var(--accent-cyan);
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.6);
  font-size: 11px;
  font-weight: 900;
  color: #ffffff;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.16s linear;
  z-index: 25;
}
.status-toast.show {
  opacity: 1;
}

.px-ico {
  width: 16px;
  height: 16px;
  image-rendering: pixelated;
  flex-shrink: 0;
  display: inline-block;
  vertical-align: middle;
}
.px-ico-lg {
  width: 24px;
  height: 24px;
}

.stage-footer {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 12px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
  pointer-events: none;
}
.hint-box {
  padding: 5px 9px;
  background: rgba(12, 18, 40, 0.92);
  border: 2px solid var(--border-ink);
  box-shadow: inset 2px 2px 0 #233364, inset -2px -2px 0 #070b18;
  font-size: 10px;
  font-weight: 700;
  color: var(--text-dim);
  pointer-events: none;
}
.touch-rot-group {
  display: flex;
  gap: 7px;
  pointer-events: auto;
}

.panel {
  display: flex;
  flex-direction: column;
  background: var(--panel-bg);
  border-left: 3px solid var(--border-ink);
  box-shadow: inset 2px 0 0 var(--panel-hi);
  overflow-y: auto;
  padding: 7px;
  gap: 5px;
}

.panel-section {
  background: #0f1630;
  border: 2px solid var(--border-ink);
  box-shadow: inset 2px 2px 0 #243364, inset -2px -2px 0 #070b18, 0 3px 0 rgba(0, 0, 0, 0.45);
  padding: 6px 8px;
}

.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.9px;
  color: var(--accent-cyan);
  padding-bottom: 3px;
  margin-bottom: 5px;
  border-bottom: 2px solid #22305e;
}
.sec-head-left {
  display: flex;
  align-items: center;
  gap: 6px;
}

.motion-nav-inline {
  display: flex;
  align-items: center;
  gap: 4px;
}
.motion-nav-btn {
  min-height: 20px;
  padding: 1px 6px;
  font-size: 10px;
}
.motion-count-badge {
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  color: var(--accent-gold);
  padding: 0 3px;
}

.motion-cat-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 5px;
}
.cat-pill {
  min-height: 21px;
  padding: 2px 6px;
  font-size: 9px;
  background: #18254c;
  color: var(--text-dim);
  border: 2px solid var(--border-ink);
  box-shadow: inset 1px 1px 0 #314786, inset -1px -1px 0 #0c1228;
  font-weight: 900;
}
.cat-pill.active {
  background: #2563eb;
  color: #ffffff;
  box-shadow: inset 1px 1px 0 #7dd3fc, inset -1px -1px 0 #173a8a;
}

.motion-shelf {
  max-height: 138px;
  overflow-y: auto;
  padding-right: 2px;
}
.motion-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
}
.motion-grid.cols-1 {
  grid-template-columns: 1fr;
}
.motion-grid.cols-2 {
  grid-template-columns: repeat(2, 1fr);
}
.motion-btn {
  flex-direction: column;
  align-items: flex-start;
  padding: 3px 5px;
  min-height: 36px;
  gap: 1px;
  overflow: hidden;
}
.motion-btn-top {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 900;
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}
.motion-btn-sub {
  font-size: 9px;
  font-weight: 700;
  color: #a8bee8;
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}
.motion-btn.active .motion-btn-sub {
  color: #e0f2fe;
}
.motion-btn.accent-ceo {
  background: #2b2968;
  box-shadow: inset 2px 2px 0 #6862c8, inset -2px -2px 0 #171542, 0 3px 0 rgba(0, 0, 0, 0.55);
}
.motion-btn.accent-companion {
  background: #1d3c78;
  box-shadow: inset 2px 2px 0 #5b90ff, inset -2px -2px 0 #10234d, 0 3px 0 rgba(0, 0, 0, 0.55);
}
.motion-btn.accent-attack {
  background: #144468;
  box-shadow: inset 2px 2px 0 #48b8ea, inset -2px -2px 0 #0a253d, 0 3px 0 rgba(0, 0, 0, 0.55);
}
.motion-btn.active {
  background: #2563eb;
  color: #ffffff;
  box-shadow: inset 2px 2px 0 #7dd3fc, inset -2px -2px 0 #173a8a, 0 3px 0 rgba(0, 0, 0, 0.55);
}

.timeline-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  font-weight: 900;
  color: var(--text-dim);
  margin-top: 7px;
  margin-bottom: 4px;
}
.timeline-head .val {
  color: var(--accent-gold);
  font-variant-numeric: tabular-nums;
}
.timeline-bar {
  display: grid;
  grid-template-columns: repeat(24, 1fr);
  gap: 2px;
  height: 16px;
  padding: 2px;
  background: #070b18;
  border: 2px solid var(--border-ink);
  cursor: pointer;
  touch-action: none;
}
.tl-cell {
  background: #1b2852;
  height: 100%;
}
.tl-cell.past {
  background: #2f57b8;
}
.tl-cell.cur {
  background: var(--accent-gold);
}

.mode-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 5px;
}
.mode-grid .px-btn {
  min-height: 25px;
  padding: 3px 6px;
  font-size: 10px;
}

.preset-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
}
.preset-grid .px-btn {
  min-height: 26px;
  padding: 3px 6px;
  font-size: 10px;
}

.file-io-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 5px;
}
.file-io-row.export-only {
  grid-template-columns: 1fr;
}
.file-io-row .px-btn {
  min-height: 26px;
  padding: 3px 4px;
  font-size: 10px;
}
.hidden-file-input {
  display: none;
}

.slider-row {
  display: grid;
  grid-template-columns: 72px 1fr 46px 56px;
  align-items: center;
  gap: 7px;
  padding: 4px 0;
  border-bottom: 2px solid #1e2a54;
  font-size: 10px;
  font-weight: 900;
}
.slider-row:last-child {
  border-bottom: none;
  padding-bottom: 1px;
}
.slider-label {
  color: var(--text-main);
  white-space: nowrap;
}
.slider-val {
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--accent-gold);
}
.slider-action {
  width: 56px;
  min-height: 25px;
  padding: 3px 0;
  font-size: 10px;
}

.px-slider {
  position: relative;
  width: 100%;
  height: 22px;
  display: flex;
  align-items: center;
  cursor: pointer;
  touch-action: none;
}
.px-slider-track {
  position: relative;
  width: 100%;
  height: 11px;
  background: #080c1d;
  border: 2px solid var(--border-ink);
  box-shadow: inset 2px 2px 0 #040610, inset -1px -1px 0 #2b3c72;
  overflow: hidden;
}
.px-slider-fill {
  height: 100%;
  background: var(--accent-blue);
  box-shadow: inset 0 2px 0 #93d5ff, inset -2px -2px 0 #1e429f;
  width: 50%;
}
.px-slider-ticks {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(90deg, transparent 0 8px, rgba(5, 8, 20, 0.72) 8px 10px);
}
.px-slider-thumb {
  position: absolute;
  top: 1px;
  width: 11px;
  height: 20px;
  transform: translateX(-5px);
  background: #e2ecff;
  border: 2px solid var(--border-ink);
  box-shadow: inset 2px 2px 0 #ffffff, inset -2px -2px 0 #6c82b0, 0 2px 0 rgba(0, 0, 0, 0.65);
  pointer-events: none;
  left: 50%;
}
.px-slider:hover .px-slider-thumb,
.px-slider.dragging .px-slider-thumb {
  background: var(--accent-gold);
}

.px-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 28px;
  padding: 4px 7px;
  background: #233368;
  color: #f4f8ff;
  border: 2px solid var(--border-ink);
  box-shadow: inset 2px 2px 0 #4662b4, inset -2px -2px 0 #121c3e, 0 3px 0 rgba(0, 0, 0, 0.55);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.3px;
}
.px-btn:hover {
  background: #2d4386;
}
.px-btn:active {
  transform: translateY(2px);
  box-shadow: inset 2px 2px 0 #121c3e, inset -2px -2px 0 #4662b4;
}
.px-btn.active {
  background: #2563eb;
  color: #ffffff;
  box-shadow: inset 2px 2px 0 #7dd3fc, inset -2px -2px 0 #173a8a, 0 3px 0 rgba(0, 0, 0, 0.55);
}
.px-btn.pink {
  background: #be185d;
  color: #fff1f2;
  box-shadow: inset 2px 2px 0 #f9a8d4, inset -2px -2px 0 #70103a, 0 3px 0 rgba(0, 0, 0, 0.55);
}
.px-btn.gold {
  background: #b47b14;
  color: #fffbeb;
  box-shadow: inset 2px 2px 0 #fde047, inset -2px -2px 0 #714908, 0 3px 0 rgba(0, 0, 0, 0.55);
}
.px-btn.teal {
  background: #0f5f76;
  color: #e6fbff;
  box-shadow: inset 2px 2px 0 #5eead4, inset -2px -2px 0 #083344, 0 3px 0 rgba(0, 0, 0, 0.55);
}

.toggle-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

@media (max-width: 860px) {
  .app-shell {
    grid-template-columns: 1fr;
    grid-template-rows: 52% 48%;
  }
  .panel {
    border-left: none;
    border-top: 3px solid var(--border-ink);
    box-shadow: inset 0 2px 0 var(--panel-hi);
    padding: 8px;
    gap: 7px;
  }
  .stage-badge {
    top: 8px;
    left: 8px;
    padding: 5px 8px;
  }
  .stage-badge-title {
    font-size: 11px;
  }
  .stage-badge-sub {
    font-size: 9px;
  }
  .hud-chip {
    top: auto;
    right: auto;
    left: 8px;
    bottom: 8px;
    padding: 5px 8px;
    font-size: 11px;
  }
  .hint-box {
    display: none;
  }
  .stage-footer {
    bottom: 8px;
    right: 8px;
    justify-content: flex-end;
  }
  .motion-shelf {
    max-height: 150px;
  }
  .slider-row {
    grid-template-columns: 68px 1fr 44px 54px;
    gap: 6px;
    padding: 5px 0;
  }
  .slider-action {
    width: 54px;
  }
}

</style>

<body>
  <div id="appRoot"></div>
  <script>
/* Anime Pseudo-3D (.ap3d) Zero-Dependency Browser Binary Codec
 *
 * Byte-compatible with `toolkit/ap3d_format.py`.
 * Works completely offline over file:// with zero external ZIP/compression libraries.
 *
 * Binary Header (24 bytes, little-endian):
 *   [0..4)   ASCII "AP3D"
 *   [4..6)   uint16 version (1)
 *   [6..8)   uint16 flags (0)
 *   [8..12)  uint32 manifestLen (UTF-8 JSON scene config)
 *   [12..16) uint32 tocLen (UTF-8 JSON [{k, m, o, s}, ...])
 *   [16..24) uint64 payloadLen (low uint32 + high uint32)
 */
(function (global) {
  "use strict";

  const MAGIC = [0x41, 0x50, 0x33, 0x44]; // "AP3D"
  const VERSION = 1;
  const HEADER_SIZE = 24;

  const textEnc = new TextEncoder();
  const textDec = new TextDecoder("utf-8");

  function dataUriToBytes(uri) {
    const comma = uri.indexOf(",");
    if (comma < 0) throw new Error("Invalid data URI");
    const head = uri.slice(5, comma);
    const semi = head.indexOf(";");
    const mime = semi >= 0 ? head.slice(0, semi) : (head || "application/octet-stream");
    const b64 = uri.slice(comma + 1);
    const binStr = atob(b64);
    const out = new Uint8Array(binStr.length);
    for (let i = 0; i < binStr.length; i++) {
      out[i] = binStr.charCodeAt(i);
    }
    return { mime, bytes: out };
  }

  async function assetSrcToBytes(src) {
    if (typeof src !== "string") {
      throw new Error("Asset source must be a data URI or Blob/Object URL");
    }
    if (src.startsWith("data:")) {
      return dataUriToBytes(src);
    }
    const resp = await fetch(src);
    const buf = await resp.arrayBuffer();
    const mime = resp.headers.get("content-type") || "application/octet-stream";
    return { mime, bytes: new Uint8Array(buf) };
  }

  async function encode(sceneConfig, assetMap) {
    const cleanCfg = {};
    for (const k of Object.keys(sceneConfig || {})) {
      if (k !== "assets") cleanCfg[k] = sceneConfig[k];
    }
    const manifestBytes = textEnc.encode(JSON.stringify(cleanCfg));

    const keys = Object.keys(assetMap || {}).sort();
    const toc = [];
    const chunks = [];
    let offset = 0;
    for (const k of keys) {
      const { mime, bytes } = await assetSrcToBytes(assetMap[k]);
      toc.push({ k, m: mime, o: offset, s: bytes.byteLength });
      chunks.push(bytes);
      offset += bytes.byteLength;
    }
    const tocBytes = textEnc.encode(JSON.stringify(toc));

    const totalLen = HEADER_SIZE + manifestBytes.byteLength + tocBytes.byteLength + offset;
    const out = new Uint8Array(totalLen);
    const dv = new DataView(out.buffer);
    out[0] = MAGIC[0];
    out[1] = MAGIC[1];
    out[2] = MAGIC[2];
    out[3] = MAGIC[3];
    dv.setUint16(4, VERSION, true);
    dv.setUint16(6, 0, true);
    dv.setUint32(8, manifestBytes.byteLength, true);
    dv.setUint32(12, tocBytes.byteLength, true);
    dv.setUint32(16, offset >>> 0, true);
    dv.setUint32(20, Math.floor(offset / 4294967296) >>> 0, true);

    let cursor = HEADER_SIZE;
    out.set(manifestBytes, cursor);
    cursor += manifestBytes.byteLength;
    out.set(tocBytes, cursor);
    cursor += tocBytes.byteLength;
    for (const chunk of chunks) {
      out.set(chunk, cursor);
      cursor += chunk.byteLength;
    }
    return out;
  }

  function decode(arrayBuffer) {
    const bytes = arrayBuffer instanceof Uint8Array ? arrayBuffer : new Uint8Array(arrayBuffer);
    if (bytes.byteLength < HEADER_SIZE) {
      throw new Error("Invalid .ap3d file: header truncated");
    }
    if (bytes[0] !== MAGIC[0] || bytes[1] !== MAGIC[1] || bytes[2] !== MAGIC[2] || bytes[3] !== MAGIC[3]) {
      // Optional JSON fallback if user dropped an uncompressed JSON bundle
      const firstChar = String.fromCharCode(bytes[0]).trim();
      if (firstChar === "{") {
        const parsed = JSON.parse(textDec.decode(bytes));
        return {
          sceneConfig: parsed.sceneConfig || parsed,
          assets: parsed.assets || {},
          objectUrls: [],
        };
      }
      throw new Error("Invalid .ap3d file: bad magic header (expected AP3D)");
    }
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const version = dv.getUint16(4, true);
    if (version !== VERSION) {
      throw new Error(`Unsupported .ap3d version: ${version}`);
    }
    const manifestLen = dv.getUint32(8, true);
    const tocLen = dv.getUint32(12, true);
    const payloadLo = dv.getUint32(16, true);
    const payloadHi = dv.getUint32(20, true);
    const payloadLen = payloadLo + payloadHi * 4294967296;

    const pManifest = HEADER_SIZE;
    const pToc = pManifest + manifestLen;
    const pPayload = pToc + tocLen;
    if (pPayload + payloadLen > bytes.byteLength) {
      throw new Error("Invalid .ap3d file: payload truncated");
    }

    const sceneConfig = JSON.parse(textDec.decode(bytes.subarray(pManifest, pToc)));
    const toc = JSON.parse(textDec.decode(bytes.subarray(pToc, pPayload)));
    const assets = {};
    const objectUrls = [];
    for (const entry of toc) {
      const slice = bytes.subarray(pPayload + entry.o, pPayload + entry.o + entry.s);
      const blob = new Blob([slice], { type: entry.m || "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      assets[entry.k] = url;
      objectUrls.push(url);
    }
    return { sceneConfig, assets, objectUrls };
  }

  function downloadBytes(bytes, filename) {
    const blob = new Blob([bytes], { type: "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename || "character.ap3d";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  function slugifyFilename(title) {
    const clean = String(title || "anime_character")
      .toLowerCase()
      .replace(/[^a-z0-9_-]+/g, "_")
      .replace(/^_+|_+$/g, "");
    return (clean || "anime_character") + ".ap3d";
  }

  global.AP3DCodec = {
    VERSION,
    encode,
    decode,
    downloadBytes,
    slugifyFilename,
  };
})(window);

</script>
  <script>
/* Anime Pseudo-3D Reusable Modular UI Component Library (`window.AnimeUIKit`)
 *
 * 100% Pixel-Art Compliant (zero native range/select inputs, zero emojis, zero rounded corners).
 * Supports:
 *   - Arbitrary-N animations (1 static model, 2, 4, 9, 16, 24, 50+ motions) with dynamic grid,
 *     scrollable motion shelf, optional category filter pills, and PREV/NEXT (`[` / `]`) stepping.
 *   - Reusable individual widgets (`createPixelSlider`, `createMotionShelf`, `createTimelineScrubber`,
 *     `createFileIOControls`) OR turnkey full studio shell (`mountStudioUI`).
 *   - Live `.ap3d` Load / Append-Merge / Export + Drag-and-Drop onto the 3D stage.
 */
(function (global) {
  "use strict";

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  function createPixelSlider({ id, label, min, max, step, getVal, setVal, formatVal, actionText, actionId, onAction, ariaLabel }) {
    const row = el("div", "slider-row");
    const lbl = el("span", "slider-label", label);

    const slider = el("div", "px-slider");
    if (id) slider.id = id;
    slider.setAttribute("role", "slider");
    slider.setAttribute("tabindex", "0");
    slider.setAttribute("aria-label", ariaLabel || label);
    slider.setAttribute("aria-valuemin", String(min));
    slider.setAttribute("aria-valuemax", String(max));

    const track = el("div", "px-slider-track");
    const fill = el("div", "px-slider-fill");
    const ticks = el("div", "px-slider-ticks");
    track.appendChild(fill);
    track.appendChild(ticks);
    const thumb = el("div", "px-slider-thumb");
    slider.appendChild(track);
    slider.appendChild(thumb);

    const valSpan = el("span", "slider-val");
    if (id) valSpan.id = id.replace(/^sl/, "val");

    const actBtn = el("button", "px-btn slider-action", actionText || "");
    actBtn.type = "button";
    if (actionId) actBtn.id = actionId;
    if (onAction) actBtn.addEventListener("click", onAction);

    row.appendChild(lbl);
    row.appendChild(slider);
    row.appendChild(valSpan);
    row.appendChild(actBtn);

    function sync() {
      let v;
      try { v = getVal(); } catch (_) { return; }
      if (typeof v !== "number" || Number.isNaN(v)) return;
      const pct = Math.max(0, Math.min(1, (v - min) / Math.max(1e-6, max - min))) * 100;
      fill.style.width = pct.toFixed(2) + "%";
      thumb.style.left = pct.toFixed(2) + "%";
      slider.setAttribute("aria-valuenow", String(v));
      valSpan.textContent = formatVal ? formatVal(v) : String(v);
    }

    function setFromClientX(clientX) {
      const rect = slider.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / Math.max(1, rect.width)));
      let v = min + ratio * (max - min);
      v = Math.round(v / step) * step;
      v = Math.max(min, Math.min(max, v));
      setVal(v);
      sync();
    }

    slider.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      slider.setPointerCapture(e.pointerId);
      slider.classList.add("dragging");
      setFromClientX(e.clientX);
    });
    slider.addEventListener("pointermove", (e) => {
      if (!slider.classList.contains("dragging")) return;
      setFromClientX(e.clientX);
    });
    const endDrag = () => slider.classList.remove("dragging");
    slider.addEventListener("pointerup", endDrag);
    slider.addEventListener("pointercancel", endDrag);
    slider.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "ArrowDown") {
        e.preventDefault();
        setVal(Math.max(min, getVal() - step));
        sync();
      } else if (e.key === "ArrowRight" || e.key === "ArrowUp") {
        e.preventDefault();
        setVal(Math.min(max, getVal() + step));
        sync();
      }
    });

    sync();
    return { el: row, slider, valSpan, actionBtn: actBtn, sync };
  }

  function createTimelineScrubber({ onScrub }) {
    const wrap = el("div", "timeline-wrap");
    const head = el("div", "timeline-head");
    const headLbl = el("span", "", "TIMELINE (SCRUB)");
    const tlVal = el("span", "val", "F01 / 24");
    tlVal.id = "tlVal";
    head.appendChild(headLbl);
    head.appendChild(tlVal);

    const bar = el("div", "timeline-bar");
    bar.id = "timelineBar";
    bar.setAttribute("role", "slider");
    bar.setAttribute("tabindex", "0");
    bar.setAttribute("aria-label", "Animation Timeline");
    bar.setAttribute("aria-valuemin", "1");

    wrap.appendChild(head);
    wrap.appendChild(bar);

    let cells = [];
    let frameCount = 24;

    function rebuild(count) {
      frameCount = Math.max(1, count | 0);
      bar.innerHTML = "";
      bar.style.gridTemplateColumns = `repeat(${frameCount}, 1fr)`;
      bar.setAttribute("aria-valuemax", String(frameCount));
      cells = [];
      for (let i = 0; i < frameCount; i++) {
        const c = el("div", "tl-cell" + (i === 0 ? " cur" : ""));
        bar.appendChild(c);
        cells.push(c);
      }
    }
    rebuild(24);

    function update(fIdx, count) {
      const fc = Math.max(1, (count || frameCount) | 0);
      if (cells.length !== fc) rebuild(fc);
      const safeF = Math.max(0, Math.min(fc - 1, fIdx | 0));
      for (let i = 0; i < fc; i++) {
        cells[i].className = i === safeF ? "tl-cell cur" : (i < safeF ? "tl-cell past" : "tl-cell");
      }
      tlVal.textContent = `F${String(safeF + 1).padStart(2, "0")} / ${fc}`;
      bar.setAttribute("aria-valuenow", String(safeF + 1));
    }

    let dragging = false;
    function scrubAt(clientX) {
      const rect = bar.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(0.9999, (clientX - rect.left) / Math.max(1, rect.width)));
      const f = Math.floor(ratio * frameCount);
      if (onScrub) onScrub(f);
    }
    bar.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      dragging = true;
      bar.setPointerCapture(e.pointerId);
      scrubAt(e.clientX);
    });
    bar.addEventListener("pointermove", (e) => { if (dragging) scrubAt(e.clientX); });
    bar.addEventListener("pointerup", () => { dragging = false; });
    bar.addEventListener("pointercancel", () => { dragging = false; });

    return { el: wrap, bar, valSpan: tlVal, update };
  }

  function createMotionShelf({ onSelect, onStep, getAssetSrc }) {
    const section = el("div", "panel-section");
    const head = el("div", "sec-head");
    const headLeft = el("div", "sec-head-left");
    const headIco = el("img", "px-ico");
    headIco.setAttribute("data-ico", "ico_anim");
    headIco.alt = "motions";
    const headTitle = el("span", "", "MOTIONS");
    headTitle.id = "motionHead";
    headLeft.appendChild(headIco);
    headLeft.appendChild(headTitle);

    const nav = el("div", "motion-nav-inline");
    const btnPrev = el("button", "px-btn motion-nav-btn", "<");
    btnPrev.type = "button";
    btnPrev.id = "btnMotionPrev";
    btnPrev.title = "Previous Motion ([)";
    const countBadge = el("span", "motion-count-badge", "1/1");
    countBadge.id = "motionCounter";
    const btnNext = el("button", "px-btn motion-nav-btn", ">");
    btnNext.type = "button";
    btnNext.id = "btnMotionNext";
    btnNext.title = "Next Motion (])";
    btnPrev.addEventListener("click", () => { if (onStep) onStep(-1); });
    btnNext.addEventListener("click", () => { if (onStep) onStep(1); });
    nav.appendChild(btnPrev);
    nav.appendChild(countBadge);
    nav.appendChild(btnNext);

    head.appendChild(headLeft);
    head.appendChild(nav);
    section.appendChild(head);

    const catBar = el("div", "motion-cat-bar");
    catBar.id = "motionCatBar";
    section.appendChild(catBar);

    const shelf = el("div", "motion-shelf");
    const grid = el("div", "motion-grid");
    grid.id = "motionGrid";
    shelf.appendChild(grid);
    section.appendChild(shelf);

    let allMotions = [];
    let activeMotionId = "";
    let activeCategory = "ALL";

    function renderGrid() {
      const visible = activeCategory === "ALL"
        ? allMotions
        : allMotions.filter((m) => (m.category || "GENERAL").toUpperCase() === activeCategory);

      grid.innerHTML = "";
      grid.className = "motion-grid";
      if (visible.length <= 1) grid.classList.add("cols-1");
      else if (visible.length <= 4) grid.classList.add("cols-2");

      visible.forEach((m) => {
        const globalIdx = allMotions.indexOf(m);
        const btn = el("button", "px-btn motion-btn");
        btn.type = "button";
        if (m.accent && m.accent !== "default") btn.classList.add("accent-" + m.accent);
        if (m.id === activeMotionId) btn.classList.add("active");
        btn.setAttribute("data-motion", m.id);

        const top = el("span", "motion-btn-top");
        if (m.icon) {
          const ico = el("img", "px-ico");
          ico.setAttribute("data-ico", m.icon);
          ico.alt = "";
          if (getAssetSrc) {
            const src = getAssetSrc(m.icon);
            if (src) ico.src = src;
          }
          top.appendChild(ico);
        }
        top.appendChild(el("span", "", `${globalIdx + 1}.${m.label}`));
        btn.appendChild(top);
        if (m.subtitle) {
          btn.appendChild(el("span", "motion-btn-sub", m.subtitle));
        }
        btn.addEventListener("click", () => { if (onSelect) onSelect(m.id); });
        grid.appendChild(btn);
      });
    }

    function refresh(motions, activeId) {
      allMotions = Array.isArray(motions) ? motions : [];
      activeMotionId = activeId || (allMotions[0] ? allMotions[0].id : "");

      const curIdx = Math.max(0, allMotions.findIndex((m) => m.id === activeMotionId));
      const curM = allMotions[curIdx];
      const fc = curM ? (curM.frames || 24) : 1;
      if (allMotions.length === 0) {
        headTitle.textContent = "NO MODEL LOADED";
      } else if (allMotions.length === 1 && fc === 1) {
        headTitle.textContent = "STATIC 3D MODEL";
      } else {
        headTitle.textContent = `${allMotions.length} MOTIONS (${fc}F)`;
      }
      nav.style.display = allMotions.length > 1 ? "flex" : "none";
      countBadge.textContent = allMotions.length > 0 ? `${curIdx + 1}/${allMotions.length}` : "0/0";

      // Build optional category filter pills whenever 2+ distinct categories exist
      const cats = [];
      const catSet = new Set();
      for (const m of allMotions) {
        if (m.category) {
          const c = String(m.category).toUpperCase();
          if (!catSet.has(c)) { catSet.add(c); cats.push(c); }
        }
      }
      if (cats.length >= 2) {
        if (activeCategory !== "ALL" && !catSet.has(activeCategory)) activeCategory = "ALL";
        catBar.style.display = "flex";
        catBar.innerHTML = "";
        ["ALL", ...cats].forEach((c) => {
          const pill = el("button", "cat-pill" + (c === activeCategory ? " active" : ""), c);
          pill.type = "button";
          pill.setAttribute("data-cat", c);
          pill.addEventListener("click", () => {
            activeCategory = c;
            catBar.querySelectorAll(".cat-pill").forEach((p) => p.classList.toggle("active", p.getAttribute("data-cat") === c));
            renderGrid();
          });
          catBar.appendChild(pill);
        });
      } else {
        activeCategory = "ALL";
        catBar.style.display = "none";
        catBar.innerHTML = "";
      }

      renderGrid();
    }

    function setActive(activeId) {
      const changed = (activeId !== activeMotionId);
      activeMotionId = activeId;
      const curIdx = Math.max(0, allMotions.findIndex((m) => m.id === activeMotionId));
      countBadge.textContent = allMotions.length > 0 ? `${curIdx + 1}/${allMotions.length}` : "0/0";
      grid.querySelectorAll("[data-motion]").forEach((btn) => {
        const isAct = btn.getAttribute("data-motion") === activeMotionId;
        btn.classList.toggle("active", isAct);
        if (changed && isAct) {
          // Scroll ONLY the inner .motion-shelf container so mobile .panel scroll never jumps!
          const top = btn.offsetTop - shelf.offsetTop;
          const bot = top + btn.offsetHeight;
          if (top < shelf.scrollTop) shelf.scrollTop = top;
          else if (bot > shelf.scrollTop + shelf.clientHeight) shelf.scrollTop = bot - shelf.clientHeight;
        }
      });
    }

    return { el: section, refresh, setActive };
  }

  function createFileIOControls({ onLoadFile, onMergeFile, onExport }) {
    const section = el("div", "panel-section");
    const head = el("div", "sec-head");
    const headLeft = el("div", "sec-head-left");
    const ico = el("img", "px-ico");
    ico.setAttribute("data-ico", "ico_layers");
    ico.alt = "package";
    const headTitle = el("span", "", "PACKAGE & EXPORT");
    headLeft.appendChild(ico);
    headLeft.appendChild(headTitle);
    head.appendChild(headLeft);
    section.appendChild(head);

    const fmtBar = el("div", "motion-cat-bar");
    fmtBar.id = "exportFmtBar";
    fmtBar.style.display = "none";
    section.appendChild(fmtBar);

    const row = el("div", "file-io-row");

    const inputLoad = el("input", "hidden-file-input");
    inputLoad.type = "file";
    inputLoad.id = "ap3dLoadInput";
    inputLoad.accept = ".ap3d,.json,application/octet-stream";
    inputLoad.addEventListener("change", () => {
      if (inputLoad.files && inputLoad.files[0] && onLoadFile) {
        onLoadFile(inputLoad.files[0]);
      }
      inputLoad.value = "";
    });

    const inputMerge = el("input", "hidden-file-input");
    inputMerge.type = "file";
    inputMerge.id = "ap3dMergeInput";
    inputMerge.accept = ".ap3d,.json,application/octet-stream";
    inputMerge.addEventListener("change", () => {
      if (inputMerge.files && inputMerge.files[0] && onMergeFile) {
        onMergeFile(inputMerge.files[0]);
      }
      inputMerge.value = "";
    });

    const btnLoad = el("button", "px-btn teal", "LOAD");
    btnLoad.type = "button";
    btnLoad.id = "btnLoadAp3d";
    btnLoad.title = "Load .ap3d character package";
    btnLoad.addEventListener("click", () => inputLoad.click());

    const btnMerge = el("button", "px-btn", "+MOTION");
    btnMerge.type = "button";
    btnMerge.id = "btnMergeAp3d";
    btnMerge.title = "Append motions from another .ap3d file";
    btnMerge.addEventListener("click", () => inputMerge.click());

    const btnExport = el("button", "px-btn gold", "EXPORT");
    btnExport.type = "button";
    btnExport.id = "btnExportAp3d";
    btnExport.title = "Export in selected format";
    let selectedFormat = "ap3d";
    let currentFormats = [];
    let currentCanLoad = true;
    btnExport.addEventListener("click", () => { if (onExport) onExport(selectedFormat); });

    row.appendChild(btnLoad);
    row.appendChild(btnMerge);
    row.appendChild(btnExport);
    section.appendChild(row);
    section.appendChild(inputLoad);
    section.appendChild(inputMerge);

    function updateExportLabel() {
      const active = currentFormats.find((f) => f.id === selectedFormat);
      btnExport.textContent = (!currentCanLoad && active) ? ("EXPORT " + active.label) : "EXPORT";
    }

    function syncCapabilities(formats, canLoad) {
      currentFormats = Array.isArray(formats) ? formats : [];
      currentCanLoad = Boolean(canLoad);
      if (currentFormats.length === 0 && !currentCanLoad) {
        section.style.display = "none";
        return;
      }
      section.style.display = "";
      headTitle.textContent = currentCanLoad ? "PACKAGE & EXPORT" : "EXPORT 3D / IMAGE";
      btnLoad.style.display = currentCanLoad ? "" : "none";
      btnMerge.style.display = currentCanLoad ? "" : "none";
      row.classList.toggle("export-only", !currentCanLoad);

      if (currentFormats.length > 0 && !currentFormats.some((f) => f.id === selectedFormat)) {
        selectedFormat = currentFormats[0].id;
      }
      fmtBar.innerHTML = "";
      if (currentFormats.length >= 2) {
        fmtBar.style.display = "flex";
        currentFormats.forEach((f) => {
          const pill = el("button", "cat-pill" + (f.id === selectedFormat ? " active" : ""), f.label);
          pill.type = "button";
          pill.setAttribute("data-expfmt", f.id);
          pill.addEventListener("click", () => {
            selectedFormat = f.id;
            fmtBar.querySelectorAll(".cat-pill").forEach((p) => p.classList.toggle("active", p.getAttribute("data-expfmt") === selectedFormat));
            updateExportLabel();
          });
          fmtBar.appendChild(pill);
        });
      } else {
        fmtBar.style.display = "none";
      }
      updateExportLabel();
    }

    return {
      el: section,
      btnLoad,
      btnMerge,
      btnExport,
      syncCapabilities,
      getSelectedFormat: () => selectedFormat,
      triggerLoad: () => inputLoad.click(),
    };
  }

  function mountStudioUI(rootEl, engine, options) {
    const opts = Object.assign(
      {
        showFileIO: true,
        showRenderModes: true,
        showViewAngles: true,
        showSliders: true,
        showToggles: true,
      },
      options || {}

    rootEl.innerHTML = "";
    if (!rootEl.style.width) rootEl.style.width = "100%";

    const shell = el("div", "app-shell");

    // === LEFT STAGE ===

    stageWrap.appendChild(canvas);

    const dropOverlay = el("div", "drop-overlay");

    stageWrap.appendChild(dropOverlay);

    const emptyBanner = el("div", "empty-stage-banner");

    emptyLoadBtn.type = "button";
    emptyBanner.appendChild(emptyLoadBtn);
    stageWrap.appendChild(emptyBanner);

    const badge = el("div", "stage-badge");

    badgeIcon.id = "badgeIcon";
    badgeIcon.setAttribute("data-ico", "ico_brand");

    const badgeText = el("div");
    const badgeTitle = el("div", "stage-badge-title", "ANIME PSEUDO-3D");
    badgeTitle.id = "badgeTitle";
    const badgeSub = el("div", "stage-badge-sub", "WEBGL 2-PASS SPRITE STACK ENGINE");
    badgeSub.id = "badgeSub";
    badgeText.appendChild(badgeTitle);
    badgeText.appendChild(badgeSub);
    badge.appendChild(badgeIcon);

    stageWrap.appendChild(badge);

    const hudChip = el("div", "hud-chip", "F01/24 | 24 FPS | 020 DEG");

    stageWrap.appendChild(hudChip);

    const toastEl = el("div", "status-toast");
    toastEl.id = "statusToast";
    stageWrap.appendChild(toastEl);

    let toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);

    const footer = el("div", "stage-footer");
    const hintBox = el("div", "hint-box", "1-9 / [ ]: MOTION | DRAG: 360 | F: FACE | B: BOUNCE | SPACE: PLAY");
    hintBox.id = "hintBox";
    const rotGrp = el("div", "touch-rot-group");
    const btnBounce = el("button", "px-btn pink", "BOUNCE");
    btnBounce.type = "button";
    btnBounce.id = "btnBounce";
    const btnRotL = el("button", "px-btn", "<3D");
    btnRotL.type = "button";
    btnRotL.id = "btnRotL";

    btnRotR.type = "button";
    btnRotR.id = "btnRotR";

    rotGrp.appendChild(btnRotL);

    footer.appendChild(hintBox);
    footer.appendChild(rotGrp);
    stageWrap.appendChild(footer);

    // === RIGHT STUDIO PANEL ===
    const panel = el("aside", "panel");

    // 1. Arbitrary-N Motion Shelf + Dynamic Timeline

      getAssetSrc: (k) => engine.getAssetSrc(k),

      onScrub: (f) => engine.setFrame(f),
    });
    motionShelf.el.appendChild(timeline.el);
    panel.appendChild(motionShelf.el);

    // 2. Render Style & Pixel Feel
    let dotSlider = null;
    if (opts.showRenderModes) {
      const sec = el("div", "panel-section");
      const sh = el("div", "sec-head");
      const sl = el("div", "sec-head-left");
      const ic = el("img", "px-ico"); ic.setAttribute("data-ico", "ico_outline"); ic.alt = "render";

      sl.appendChild(el("span", "", "RENDER STYLE & PIXEL FEEL"));
      sh.appendChild(sl);
      sec.appendChild(sh);

      const mgrid = el("div", "mode-grid");
      [
        ["0", "PIXEL+AA"],
        ["1", "RETRO PX"],
        ["2", "SMOOTH AA"],
        ["3", "SILKY 3D"],
      ].forEach(([rm, txt]) => {
        const b = el("button", "px-btn", txt);

      dotSlider = createPixelSlider({

      dotSlider.el.style.paddingBottom = "0";

      panel.appendChild(sec);
    }

    // 3. View Angles
    if (opts.showViewAngles) {
      const sec = el("div", "panel-section");
      const sh = el("div", "sec-head");
      const sl = el("div", "sec-head-left");
      const ic = el("img", "px-ico"); ic.setAttribute("data-ico", "ico_cam"); ic.alt = "camera";
      sl.appendChild(ic);
      sl.appendChild(el("span", "", "VIEW ANGLES"));
      sh.appendChild(sl);
      sec.appendChild(sh);

      const pgrid = el("div", "preset-grid");
      [
        ["0", "FRONT"], ["24", "3/4 L"], ["90", "L SIDE"],
        ["180", "BACK"], ["270", "R SIDE"], ["336", "3/4 R"],
      ].forEach(([deg, txt]) => {
        const b = el("button", "px-btn", txt);
        b.type = "button";
        b.setAttribute("data-angle", deg);
        b.addEventListener("click", () => engine.setAngleDeg(Number(deg)));
        pgrid.appendChild(b);
      });
      sec.appendChild(pgrid);
      panel.appendChild(sec);
    }

    // 4. Anim & 3D Controls
    let fpsSlider, pitchSlider, spacingSlider, zoomSlider;
    if (opts.showSliders) {
      const sec = el("div", "panel-section");
      const sh = el("div", "sec-head");
      const sl = el("div", "sec-head-left");
      const ic = el("img", "px-ico"); ic.setAttribute("data-ico", "ico_layers"); ic.alt = "controls";
      sl.appendChild(ic);
      sl.appendChild(el("span", "", "ANIM & 3D CONTROLS"));

        setVal: (v) => engine.setFps(v),
        formatVal: (v) => String(Math.round(v)),
        actionText: "PLAY", actionId: "btnPlayAnim",
        onAction: () => engine.togglePlay(),
      });
      pitchSlider = createPixelSlider({
        id: "slSquash", label: "PITCH", ariaLabel: "Camera Pitch Angle", min: 15, max: 90, step: 1,
        getVal: () => engine.getState().pitchDeg,
        setVal: (v) => engine.setPitchDeg(v),
        formatVal: (v) => String(Math.round(v)) + "°",
        actionText: "TOP", actionId: "btnTopView",
        onAction: () => engine.toggleTopView(),
      });
      spacingSlider = createPixelSlider({
        id: "slSpacing", label: "SPACING", min: 0.5, max: 2.2, step: 0.05,
        getVal: () => engine.getState().spacing,
        setVal: (v) => engine.setSpacing(v),
        formatVal: (v) => v.toFixed(2),
        actionText: "SPREAD", actionId: "btnSpread",
        onAction: () => engine.toggleSpread(),
      });
      zoomSlider = createPixelSlider({
        id: "slZoom", label: "ZOOM", min: 0.8, max: 3.2, step: 0.05,
        getVal: () => engine.getState().zoom,
        setVal: (v) => engine.setZoom(v),
        formatVal: (v) => v.toFixed(2) + "x",
        actionText: "FACE", actionId: "btnFaceZoom",
        onAction: () => engine.toggleFaceFocus(),
      });

      sec.appendChild(fpsSlider.el);
      sec.appendChild(pitchSlider.el);
      sec.appendChild(spacingSlider.el);
      sec.appendChild(zoomSlider.el);
      panel.appendChild(sec);
    }

    // 5. Display & Effects Toggles
    let btnAutoSpin, btnFx, btnOutline, btnTheme, txtTheme, btnSpring, btnReset;
    if (opts.showToggles) {
      const sec = el("div", "panel-section");
      const sh = el("div", "sec-head");
      const sl = el("div", "sec-head-left");
      const ic = el("img", "px-ico"); ic.setAttribute("data-ico", "ico_theme"); ic.alt = "style";
      sl.appendChild(ic);
      sl.appendChild(el("span", "", "DISPLAY & EFFECTS"));
      sh.appendChild(sl);
      sec.appendChild(sh);

      const trow = el("div", "toggle-row");
      btnAutoSpin = el("button", "px-btn active"); btnAutoSpin.type = "button"; btnAutoSpin.id = "btnAutoSpin";
      btnAutoSpin.appendChild(el("span", "", "SPIN: ON"));
      btnAutoSpin.addEventListener("click", () => engine.toggleFlag("autoSpin"));

      btnFx = el("button", "px-btn active"); btnFx.type = "button"; btnFx.id = "btnFx";
      btnFx.appendChild(el("span", "", "FX: ON"));
      btnFx.addEventListener("click", () => engine.toggleFlag("fxOn"));

      btnOutline = el("button", "px-btn active"); btnOutline.type = "button"; btnOutline.id = "btnOutline";
      const icOut = el("img", "px-ico"); icOut.setAttribute("data-ico", "ico_outline"); icOut.alt = "";
      btnOutline.appendChild(icOut);

    let fileIO = null;
    if (opts.showFileIO) {
      fileIO = createFileIOControls({
        onLoadFile: async (file) => {
          try {
            await engine.loadAP3DFile(file, { merge: false });

          } catch (err) {
            showToast(`LOAD ERROR: ${err.message || err}`);
          }
        },
        onMergeFile: async (file) => {
          try {
            const added = await engine.loadAP3DFile(file, { merge: true });
            showToast(`MERGED +${added} MOTIONS FROM ${file.name}`);
          } catch (err) {
            showToast(`MERGE ERROR: ${err.message || err}`);
          }
        },
        onExport: async (fmt) => {
          try {
            const info = (typeof engine.exportByFormat === "function")
              ? await engine.exportByFormat(fmt)
              : await engine.exportAP3D();
            if (info && info.filename) {
              const kb = info.bytes ? ` (${Math.max(1, Math.round(info.bytes / 1024))} KB)` : "";
              showToast(`EXPORTED ${info.filename}${kb}`);
            }
          } catch (err) {
            showToast(`EXPORT ERROR: ${err.message || err}`);
          }

    shell.appendChild(panel);

    function canAcceptAp3dDrop() {

    let dragCounter = 0;
    stageWrap.addEventListener("dragenter", (e) => {
      if (!canAcceptAp3dDrop()) return;
      e.preventDefault();
      dragCounter++;
      dropOverlay.classList.add("active");
    });
    stageWrap.addEventListener("dragover", (e) => { if (canAcceptAp3dDrop()) e.preventDefault(); });
    stageWrap.addEventListener("dragleave", () => {
      if (!canAcceptAp3dDrop()) return;
      dragCounter = Math.max(0, dragCounter - 1);
      if (dragCounter === 0) dropOverlay.classList.remove("active");

      if (!canAcceptAp3dDrop()) return;
      e.preventDefault();
      dragCounter = 0;
      dropOverlay.classList.remove("active");

      if (!file) return;
      try {
        if (e.shiftKey) {
          const added = await engine.loadAP3DFile(file, { merge: true });
          showToast(`MERGED +${added} MOTIONS FROM ${file.name}`);
        } else {
          await engine.loadAP3DFile(file, { merge: false });
          showToast(`LOADED: ${file.name}`);
        }
      } catch (err) {
        showToast(`DROP ERROR: ${err.message || err}`);
      }
    });

    // Wire hold buttons & canvas interactions
    btnBounce.addEventListener("click", () => engine.triggerBounce());
    function bindHold(btn, dir) {
      const start = (e) => { e.preventDefault(); engine.setHoldRotDir(dir); };
      const stop = () => { if (engine.getState().holdRotDir === dir) engine.setHoldRotDir(0); };
      btn.addEventListener("pointerdown", start);
      window.addEventListener("pointerup", stop);
      window.addEventListener("pointercancel", stop);
    }
    bindHold(btnRotL, -1);
    bindHold(btnRotR, 1);

    function hydrateIcons() {
      rootEl.querySelectorAll("[data-ico]").forEach((img) => {
        const key = img.getAttribute("data-ico");
        const src = engine.getAssetSrc(key);
        if (src) {
          img.src = src;
          img.style.visibility = "visible";
        } else {
          img.style.visibility = "hidden";
        }
      });
    }

    function syncAll() {
      const st = engine.getState();
      if (!st) return;
      const cfg = engine.getConfig() || {};
      const motions = engine.getMotions() || [];

      emptyBanner.style.display = motions.length === 0 ? "block" : "none";
      badgeTitle.textContent = cfg.title || "ANIME PSEUDO-3D";
      badgeSub.textContent = cfg.subtitle || "WEBGL 2-PASS SPRITE STACK ENGINE";
      if (cfg.badge_icon) badgeIcon.setAttribute("data-ico", cfg.badge_icon);
      if (cfg.title) document.title = cfg.title;

      motionShelf.setActive(st.motion);

      rootEl.querySelectorAll("[data-rmode]").forEach((btn) => {
        btn.classList.toggle("active", Number(btn.getAttribute("data-rmode")) === st.renderMode);
      });

      if (dotSlider) dotSlider.sync();
      if (fpsSlider) {
        fpsSlider.sync();
        fpsSlider.actionBtn.textContent = st.animPlaying ? "PLAY" : "STOP";
        fpsSlider.actionBtn.classList.toggle("active", st.animPlaying);
      }
      if (pitchSlider) {
        pitchSlider.sync();
        pitchSlider.actionBtn.classList.toggle("active", st.pitchDeg >= 89);
      }
      if (spacingSlider) {
        spacingSlider.sync();
        spacingSlider.actionBtn.classList.toggle("active", st.spacing >= 1.80);
      }
      if (zoomSlider) {
        zoomSlider.sync();
        zoomSlider.actionBtn.classList.toggle("active", st.faceFocus);
      }

      if (btnAutoSpin) {
        btnAutoSpin.classList.toggle("active", st.autoSpin);
        btnAutoSpin.querySelector("span").textContent = st.autoSpin ? "SPIN: ON" : "SPIN: OFF";
      }
      if (btnFx) {
        btnFx.classList.toggle("active", st.fxOn);
        btnFx.querySelector("span").textContent = st.fxOn ? "FX: ON" : "FX: OFF";
      }
      if (btnOutline) {
        btnOutline.classList.toggle("active", st.outlineOn);
        btnOutline.querySelector("span").textContent = st.outlineOn ? "OUTLINE: ON" : "OUTLINE: OFF";
      }
      if (btnSpring) {
        btnSpring.classList.toggle("active", st.springOn);
        btnSpring.querySelector("span").textContent = st.springOn ? "SPRING: ON" : "SPRING: OFF";
      }
      if (txtTheme) {
        txtTheme.textContent = engine.getThemeName();
      }
    }

    function syncScene() {
      const st = engine.getState();
      const motions = engine.getMotions();
      motionShelf.refresh(motions, st.motion);
      const curM = engine.getActiveMotion();
      timeline.update(st.manualFrame, curM ? (curM.frames || 24) : 1);
      if (fileIO) {
        const fmts = (engine.getExportFormats && engine.getExportFormats()) || (global.AP3DCodec ? [{ id: "ap3d", label: ".AP3D" }] : []);
        fileIO.syncCapabilities(fmts, canAcceptAp3dDrop());
      }
      syncAll();
      hydrateIcons();
    }

    function updateHud(text) {
      hudChip.textContent = text;
    }

    function updateTimeline(fIdx, fc) {
      timeline.update(fIdx, fc);
    }

    return {
      canvas,
      stageWrap,
      hudChip,
      showToast,
      syncScene,
      syncAll,
      updateHud,
      updateTimeline,
      hydrateIcons,
    };
  }

  global.AnimeUIKit = {
    createPixelSlider,
    createMotionShelf,
    createTimelineScrubber,
    createFileIOControls,
    mountStudioUI,
  };
})(window);

  <script>
/* Anime Pseudo-3D WebGL 2-Pass Sprite-Stack Engine (Reusable, Character-Agnostic & Hot-Reloadable)
 *
 * Public Factory API:
 *   const engine = window.AnimeStackEngine.create({
 *     canvas, config, assets,
 *     onHudUpdate, onTimelineUpdate, onStateChange, onSceneChange
 *   });
 *
 * Supports:
 *   - Continuous 0.001-deg GPU rotation + true 3D orthographic elevation (`y = rot.y * sinP - z * cosP * spacing`)
 *   - 2x interleaved sub-slices + 2x-SSAA FBO + 4 live render modes (SMOOTH AA, PIXEL+AA, RETRO PX, SILKY 3D)
 *   - Arbitrary-N animations (1 static model, 2, 9, 24, 50+ motions) + runtime `addMotions()` & `loadScene()`
 *   - Multi-object 3D companion sprite-stack FBOs with exact camera-angle Z-sorting
 *   - Portable `.ap3d` binary export, load, and merge via `window.AP3DCodec`
 *   - Automatic studio mounting via `window.AnimeUIKit.mountStudioUI` when `#appRoot` is present
 */
(function (global) {
  "use strict";

  const TWO_PI = Math.PI * 2;
  const THEMES = [
    { name: "DEEP SEA", bg: [13/255, 22/255, 48/255], grid: [24/255, 39/255, 80/255], star: [100/255, 181/255, 246/255], starHi: [212/255, 240/255, 255/255], outline: [34/255, 38/255, 82/255] },
    { name: "ICE LAB",  bg: [223/255, 233/255, 248/255], grid: [198/255, 214/255, 238/255], star: [107/255, 143/255, 212/255], starHi: [1, 1, 1], outline: [36/255, 42/255, 88/255] },
    { name: "MIDNIGHT", bg: [18/255, 15/255, 36/255], grid: [34/255, 28/255, 66/255], star: [129/255, 140/255, 248/255], starHi: [254/255, 240/255, 138/255], outline: [24/255, 20/255, 56/255] },
  ];

  function createEngine(options) {
    const opts = options || {};
    const canvas = opts.canvas;
    if (!canvas) throw new Error("AnimeStackEngine.create requires a <canvas> element");

    const gl = canvas.getContext("webgl", {
      alpha: false,
      antialias: false,
      depth: false,
      stencil: false,
      premultipliedAlpha: true,
      preserveDrawingBuffer: true,
    });
    if (!gl) throw new Error("WebGL unavailable in this browser");

    const hasDeriv = !!gl.getExtension("OES_standard_derivatives");

    function compileShader(type, src) {
      const sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
        throw new Error("Shader compile error: " + gl.getShaderInfoLog(sh));
      }
      return sh;
    }

    function createProgram(vsSrc, fsSrc) {
      const p = gl.createProgram();
      gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vsSrc));
      gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fsSrc));
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
        throw new Error("Program link error: " + gl.getProgramInfoLog(p));
      }
      return p;
    }

    const bgProg = createProgram(
      `
      attribute vec2 aPos;
      varying vec2 vUv;
      void main() {
        vUv = aPos * 0.5 + 0.5;
        gl_Position = vec4(aPos, 0.0, 1.0);
      }
      `,
      `
      precision mediump float;
      varying vec2 vUv;
      uniform vec2 uRes;
      uniform vec3 uBg;
      uniform vec3 uGrid;
      uniform vec3 uStar;
      uniform vec3 uStarHi;
      uniform float uTime;

      float hash21(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }

      void main() {
        vec2 px = vUv * uRes;
        vec2 dv = vUv - vec2(0.5, 0.5);
        float vig = 1.0 - dot(dv, dv) * 0.28;
        vec3 col = uBg * clamp(vig, 0.80, 1.05);

        float stepPx = 32.0;
        vec2 g = mod(px - 0.5 * mod(uRes, stepPx), stepPx);
        if (g.x < 1.2 || g.y < 1.2) {
          col = mix(col, uGrid, 0.65);
        }

        vec2 cell = floor(px / 48.0);
        vec2 loc = fract(px / 48.0) * 48.0;
        float h = hash21(cell);
        if (h > 0.82) {
          vec2 spos = vec2(8.0 + hash21(cell + 7.1) * 32.0, 8.0 + hash21(cell + 19.3) * 32.0);
          float sz = (h > 0.94) ? 2.6 : 1.6;
          if (abs(loc.x - spos.x) < sz * 0.5 && abs(loc.y - spos.y) < sz * 0.5) {

    const stackProg = createProgram(
      `
      attribute vec2 aCorner;
      attribute vec3 aSlice;

      uniform vec2 uFboSize;
      uniform vec2 uPivot;
      uniform vec2 uSliceDim;
      uniform float uAngle;
      uniform float uSquash;
      uniform float uSpacing;
      uniform vec2 uSpring;

      varying vec2 vLocalUV;
      varying vec2 vTileOrigin;

      void main() {
        vec2 p = aCorner * uSliceDim;
        float ca = cos(uAngle);
        float sa = sin(uAngle);
        vec2 rot = vec2(p.x * ca - p.y * sa, p.x * sa + p.y * ca);
        vec2 stacked = vec2(rot.x, rot.y * uSquash - aSlice.x * uSpacing);
        stacked *= uSpring;

        vec2 pos = uPivot + stacked;
        vec2 ndc = (pos / uFboSize) * 2.0 - 1.0;
        ndc.y = -ndc.y;

      (hasDeriv ? "#extension GL_OES_standard_derivatives : enable\n" : "") +
      `
      precision highp float;
      uniform sampler2D uAtlas;
      uniform vec2 uSliceDim;
      uniform vec2 uAtlasGrid;
      uniform int uMode;

      varying vec2 vLocalUV;
      varying vec2 vTileOrigin;

      vec4 fetchTexel(vec2 tc) {
        vec2 c = clamp(tc, vec2(0.0), uSliceDim - vec2(1.0));
        vec2 uv = (vTileOrigin + (c + 0.5) / uSliceDim) / uAtlasGrid;
        return texture2D(uAtlas, uv);
      }

      void main() {
        vec2 tCoord = vLocalUV * uSliceDim - 0.5;
        if (uMode == 2) {
          vec4 c = fetchTexel(floor(tCoord + 0.5));
          if (c.a < 0.5) discard;
          gl_FragColor = vec4(c.rgb, 1.0);
          return;
        }

        vec2 fl = floor(tCoord);
        vec2 fr = fract(tCoord);
        vec2 w;
        if (uMode == 0) {
          ` + (hasDeriv ? `
          vec2 fw = clamp(fwidth(tCoord), vec2(0.05), vec2(0.95));
          w = clamp((fr - 0.5) / fw + 0.5, 0.0, 1.0);
          ` : `
          w = smoothstep(0.28, 0.72, fr);
          `) + `
        } else {
          w = fr * fr * (3.0 - 2.0 * fr);
        }

        vec4 c00 = fetchTexel(fl);
        vec4 c10 = fetchTexel(fl + vec2(1.0, 0.0));
        vec4 c01 = fetchTexel(fl + vec2(0.0, 1.0));
        vec4 c11 = fetchTexel(fl + vec2(1.0, 1.0));

        float w00 = (1.0 - w.x) * (1.0 - w.y);
        float w10 = w.x * (1.0 - w.y);
        float w01 = (1.0 - w.x) * w.y;
        float w11 = w.x * w.y;

        float a = c00.a * w00 + c10.a * w10 + c01.a * w01 + c11.a * w11;
        if (a < 0.06) discard;

        vec3 rgbSum = c00.rgb * (c00.a * w00) + c10.rgb * (c10.a * w10)

        vec3 rgb = rgbSum / max(a, 1e-4);

        float outA = (uMode == 0) ? smoothstep(0.24, 0.72, a) : smoothstep(0.18, 0.78, a);
        if (outA < 0.02) discard;

        gl_FragColor = vec4(rgb * outA, outA);
      }
      `
    );

      `
      attribute vec2 aPos;
      uniform vec4 uRect;
      uniform vec2 uRes;
      uniform float uRot;
      varying vec2 vUv;
      void main() {
        vec2 local = aPos * (uRect.zw * 0.5);

        float sr = sin(uRot);
        vec2 rot = vec2(local.x * cr - local.y * sr, local.x * sr + local.y * cr);
        vec2 p = uRect.xy + rot;
        vec2 ndc = (p / uRes) * 2.0 - 1.0;
        ndc.y = -ndc.y;
        gl_Position = vec4(ndc, 0.0, 1.0);
        vUv = aPos * 0.5 + 0.5;
      }
      `,
      `
      precision mediump float;
      uniform sampler2D uTex;
      uniform float uAlpha;
      uniform vec3 uTint;
      varying vec2 vUv;
      void main() {
        vec4 c = texture2D(uTex, vUv);
        if (c.a < 0.01) discard;

    );

    const compProg = createProgram(
      `
      attribute vec2 aPos;
      uniform vec4 uRect;
      uniform vec2 uRes;
      varying vec2 vUv;
      void main() {
        vec2 p = uRect.xy + aPos * (uRect.zw * 0.5);

      (hasDeriv ? "#extension GL_OES_standard_derivatives : enable\n" : "") +
      `

      uniform sampler2D uFboTex;
      uniform vec2 uTexel;

      vec4 sampleCell(vec2 cellIdx, vec2 gridDim) {

        return texture2D(uFboTex, uv);
      }

      vec4 samplePixelAA(vec2 pCoord, vec2 gridDim) {
        vec2 fl = floor(pCoord - 0.5);
        vec2 fr = fract(pCoord - 0.5);
        ` + (hasDeriv ? `
        vec2 fw = clamp(fwidth(pCoord) * 1.15, vec2(0.04), vec2(0.42));
        vec2 w = clamp((fr - 0.5) / fw + 0.5, 0.0, 1.0);
